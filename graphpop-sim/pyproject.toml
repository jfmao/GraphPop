[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphpop-sim"
version = "0.2.0.dev0"
description = "Simulation integration for GraphPop (msprime / SLiM / ABC; M12 = Phase 6)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jianfeng Mao"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["graphpop", "msprime", "slim", "abc", "simulation"]
dependencies = [
    "click>=8.0",
    "numpy>=1.22",
    "pyyaml>=6.0",
    "msprime>=1.3",
    "tskit>=0.6",
]

[project.optional-dependencies]
slim = [
    "pyslim>=1.0",
]
ingest = [
    "neo4j>=5.0",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
graphpop-sim = "graphpop_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphpop_sim = ["slim_templates/*.slim"]
