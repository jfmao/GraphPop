[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphpop-gnn"
version = "0.2.0.dev0"
description = "GNN embeddings for GraphPop sample-variant graphs (M10)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jianfeng Mao"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["graphpop", "gnn", "embeddings", "graphsage", "pytorch-geometric"]
dependencies = [
    "neo4j>=5.0",
    "numpy>=1.22",
    "click>=8.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "torch-geometric>=2.5",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
graphpop-gnn = "graphpop_gnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
