[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphpop-import"
version = "0.2.0.dev0"
description = "VCF to Neo4j import pipeline for GraphPop"
requires-python = ">=3.11"
dependencies = [
    "cyvcf2",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
arg = [
    "tskit>=0.6",
    "tsinfer>=0.4",
    "tsdate>=0.2",
    "msprime>=1.3",
]

[project.scripts]
graphpop-import = "graphpop_import.bulk_import:main"

[tool.setuptools.packages.find]
where = ["src"]
