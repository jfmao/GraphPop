[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphpop-bench"
version = "0.2.0.dev0"
description = "Cross-paper benchmarking + comparison harness for GraphPop"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jianfeng Mao"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["graphpop", "benchmark", "comparison-harness", "profiling"]
dependencies = [
    "click>=8.0",
    "numpy>=1.22",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
compare = [
    "tskit>=0.6",
    "egrm>=0.4",
]
figures = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
graphpop-bench = "graphpop_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
